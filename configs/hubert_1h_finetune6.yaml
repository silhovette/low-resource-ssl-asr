# HuBERT fine-tuning: 3 frozen epochs + 5 fine-tune epochs (unfreeze top 6 layers)
run_name: hubert_1h_finetune6_hf_cuda
seed: 1337
device: cuda
train_manifest: data/manifests/train-clean-100_1h_hf.jsonl
dev_manifest: data/manifests/dev-clean_hf.jsonl
test_manifest: data/manifests/test-clean_hf.jsonl
output_dir: outputs/hubert_1h_finetune6_hf_cuda
model:
  type: ssl_ctc
  pretrained_name: facebook/hubert-base-ls960
  freeze_encoder: true
  hidden_layer: last
  dropout: 0.1
training:
  epochs: 8
  batch_size: 2
  learning_rate: 0.001
  max_audio_seconds: 18
  max_eval_audio_seconds: 30
  grad_clip: 1.0
  num_workers: 0
  # Fine-tuning settings
  finetune_start_epoch: 4
  finetune_layers: 6
  finetune_lr: 0.0001
decode:
  blank_id: 0
